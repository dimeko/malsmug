services:
  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    restart: always
    ports:
      - ${RABBITMQ_CONNECTION_PORT}:5672
      - 127.0.0.1:15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_CONNECTION_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_CONNECTION_PASSWORD}
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
  sandbox:
    build:
      context: .
      dockerfile: ./docker/sandbox_Dockerfile
    image: js-sandbox
    container_name: js-sandbox-av
    init: true
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      ANALYSIS_TIMEOUT_S: "120"
    mem_limit: 4g
    pids_limit: 1024
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    volumes:
      - ./sandbox/consumer/main.py:/sandbox/consumer/main.py
      - ${CONFIG_FOLDER}:/sandbox/config/
  sandbox-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: ./docker/dev_sandbox_Dockerfile
    image: js-sandbox-dev
    init: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    volumes:
      - ./sandbox/src:/sandbox/src:ro
      - ./sandbox/test:/sandbox/test:ro
      - ${SAMPLES_FOLDER:-./js-samples}:/samples:ro

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."  

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
